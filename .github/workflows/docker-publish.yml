name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
  release:
    types: [published]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_PREFIX: hiperautos

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Check Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Secrets not found. Skipping push."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build and Push Log-Service
      - name: Build and push Log-Service
        uses: docker/build-push-action@v5
        with:
          context: ./log-service
          file: ./log-service/Dockerfile
          push: ${{ steps.check-secrets.outputs.has_secrets == 'true' }}
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_PREFIX }}-log-service:latest

      # 2. Build and Push Vector
      - name: Build and push Vector
        uses: docker/build-push-action@v5
        with:
          context: ./vector
          file: ./vector/Dockerfile
          push: ${{ steps.check-secrets.outputs.has_secrets == 'true' }}
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_PREFIX }}-vector:latest

      # 3. Build and Push Grafana
      - name: Build and push Grafana
        uses: docker/build-push-action@v5
        with:
          context: ./grafana
          file: ./grafana/Dockerfile
          push: ${{ steps.check-secrets.outputs.has_secrets == 'true' }}
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_PREFIX }}-grafana:latest
