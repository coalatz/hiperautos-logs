server.port=8080
spring.application.name=log-service

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://postgres:5432/logsdb
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- AI API (Groq) ---
# Valores injetados via variáveis de ambiente no docker-compose
api.groq.url=${GROQ_API_URL}
api.groq.key=${GROQ_API_KEY}

# --- Async Thread Pool ---
# Configurável sem recompilar a aplicação
app.async.core-pool-size=5
app.async.max-pool-size=20
app.async.queue-capacity=200
