services:
  vector:
    image: ${DOCKERHUB_USERNAME:-hiperautos}/vector:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - log-service

  log-service:
    image: ${DOCKERHUB_USERNAME:-hiperautos}/log-service:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - GROQ_API_URL=https://api.groq.com/openai/v1/chat/completions
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "8080:8080"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: logsdb
    volumes:
      - hiperautos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d logsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: ${DOCKERHUB_USERNAME:-hiperautos}/grafana:latest
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}

volumes:
  hiperautos_data:
